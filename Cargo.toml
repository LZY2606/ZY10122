[package]
name = "acoustic-review"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "acoustic-review"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

[dev-dependencies]
tempfile = "3"
